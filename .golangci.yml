version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - (*gorm.io/gorm.DB).AutoMigrate
        - (io.Closer).Close

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
