name: CI Pipeline

on:
  push:
    branches: [ "main", "boilerplate" ]
  pull_request:
    branches: [ "main", "boilerplate" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting (gofmt)
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Unformatted Go files:"
          echo "$unformatted"
          exit 1
        fi

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Unit Tests
      run: go test -v -race ./...

    - name: Build Binaries
      run: go build ./...
