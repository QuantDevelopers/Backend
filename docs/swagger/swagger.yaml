  github_com_QuantDevelopers_Backend_internal_application_dto_crawler.CrawlStatusResponse:
    properties:
      checked_at:
        type: string
      database:
        $ref: '#/definitions/github_com_QuantDevelopers_Backend_internal_application_dto_crawler.DBCoverageSummary'
      latest_job:
