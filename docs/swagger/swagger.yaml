basePath: /
consumes:
- application/json
definitions:
  github_com_QuantDevelopers_Backend_internal_application_dto_common.PaginationMeta:
    properties:
      currentPage:
        type: integer
      hasNextPage:
        type: boolean
      hasPrevPage:
